name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # npm run check compares the templates with main (domain rules, 3). The
      # checkout holds only the pull request's merge commit, so main is fetched.
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
